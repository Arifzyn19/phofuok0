name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html exists
        run: test -f index.html && echo "✓ index.html found" || (echo "✗ index.html missing" && exit 1)

      - name: Validate HTML (basic)
        run: |
          echo "→ Checking required features..."
          grep -q 'tankInput' index.html && echo "✓ tank input found"
          grep -q 'fishGrid' index.html && echo "✓ fish presets found"
          grep -q 'barFill' index.html && echo "✓ capacity bar found"
          grep -q 'lucide' index.html && echo "✓ lucide icons found"
          grep -q 'Overstocked' index.html && echo "✓ summary text found"
          echo "→ All checks passed!"

      - name: HTML5 Validator (optional)
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          css: true
        continue-on-error: true
